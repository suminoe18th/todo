<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-todo-form" class="new-todo">
      <input id="new-todo-input" type="text" placeholder="やることを入力して Enter" autocomplete="off" autofocus>
      <button type="submit">追加</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <footer id="footer" class="footer" hidden>
      <span id="count"></span>
      <div class="filters" role="tablist">
        <button type="button" data-filter="all">すべて</button>
        <button type="button" data-filter="active">未完了</button>
        <button type="button" data-filter="completed">完了</button>
      </div>
      <button type="button" id="clear-completed" class="link">完了を削除</button>
    </footer>

    <p class="hint">ダブルクリックで編集</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
